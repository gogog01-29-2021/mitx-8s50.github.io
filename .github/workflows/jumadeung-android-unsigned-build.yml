name: Build Jumadeung Android APK and unsigned AAB

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-build/**'
      - '.github/workflows/jumadeung-android-unsigned-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android application
        working-directory: android-build/jumadeung-android
        run: gradle --no-daemon --stacktrace clean assembleDebug bundleRelease
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-build/output
          APK="$(find android-build/jumadeung-android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          AAB="$(find android-build/jumadeung-android/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" android-build/output/jumadeung-debug.apk
          cp "$AAB" android-build/output/jumadeung-release-unsigned.aab
          sha256sum android-build/output/* > android-build/output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jumadeung-android-unsigned-build
          path: android-build/output/
          if-no-files-found: error
          retention-days: 30
